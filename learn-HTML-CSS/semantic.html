<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>آموزش تگ‌های معنایی</title>
</head>
<body>

    <!-- سربرگ سایت -->
    <header>
        <h1>نام وب‌سایت من</h1>
        <nav>
            <ul>
                <li><a href="#">خانه</a></li>
                <li><a href="#">مقالات</a></li>
                <li><a href="#">تماس با ما</a></li>
            </ul>
        </nav>
    </header>

    <!-- محتوای اصلی صفحه -->
    <main>
        <!-- یک مقاله مستقل -->
        <article>
            <header>
                <h2>HTML5 و سئو</h2>
                <time datetime="2023-10-25">۳ آبان ۱۴۰۲</time>
            </header>
            
            <p>تگ‌های معنایی تاثیر زیادی در درک ربات‌های گوگل از سایت ما دارند...</p>
            
            <!-- بخشی داخل مقاله -->
            <section>
                <h3>تگ article چیست؟</h3>
                <p>این تگ برای محتوای مستقل استفاده می‌شود.</p>
            </section>
        </article>
    </main>

    <!-- نوار کناری سایت -->
    <aside>
        <h3>تبلیغات</h3>
        <p>اینجا بنر تبلیغاتی قرار می‌گیرد.</p>
    </aside>

    <!-- پاصفحه سایت -->
    <footer>
        <p>تمامی حقوق محفوظ است &copy; ۲۰۲۳</p>
    </footer>
    

</body>
</html>
