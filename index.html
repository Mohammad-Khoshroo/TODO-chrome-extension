<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>TODO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/stick-note.ico?v=0" type="image/x-icon">
    <link href="vazirmatn/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css">
    <script src="jallali/dist/jalaali.min.js"></script>

</head>

<body>

    <div class="Calendar" id="calendar">
        <button class="toggleCalendarBtn" id="calendar-btn">− بستن تقویم</button>
        <div class="header">
            <button id="prevBtn">❮</button>
            <div id="monthYear"></div>
            <button id="nextBtn">❯</button>
        </div>
        <div class="weekdays">
            <div>ش</div>
            <div>ی</div>
            <div>د</div>
            <div>س</div>
            <div>چ</div>
            <div>پ</div>
            <div>ج</div>
        </div>
        <div class="days" id="daysContainer"></div>
    </div>

    <div id="trash-bin">
        <img id="trash" src="images/trash-bin.ico" alt="trash-bin" width="70" height="70">
    </div>
    <div id="eraser" draggable="true" title="Drag over task to delete instantly">
        <img src="images/eraser.ico" alt="eraser" width="45" height="45">
    </div>
    <div id="pencil" class="pencil" draggable="true" title="Drag to scribble!">
        <img src="images/pencil.ico" alt="pencil" width="45" height="45">
    </div>
    <button id="add-note-btn">Add Note +</button>

    <div id="container"></div>

    <script src="script.js"></script>

</body>

</html>
